name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: framed_public
          POSTGRES_USER: framed
          POSTGRES_PASSWORD: framed-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U framed -d framed_public"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pytest pytest-timeout ruff bandit
      - name: Lint (ruff - non-blocking initially)
        run: ruff check . --output-format=github || true
      - name: Security (bandit)
        run: bandit -r framed -q || true
      - name: Tests
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          set -uo pipefail
          WHOLE_RC=0
          FRAMED_RC=0
          COGNITION_RC=0
          TOP_RC=0

          label_rc() {
            case "$1" in
              0) echo "PASS" ;;
              124) echo "TIMEOUT (wall clock)" ;;
              *) echo "FAIL (rc=$1)" ;;
            esac
          }

          echo "=== whole suite (authoritative gate) ==="
          timeout --kill-after=30 1200 pytest -v --timeout=180 -ra || WHOLE_RC=$?

          echo "=== framed/tests (diagnostic split) ==="
          timeout --kill-after=30 900 pytest -q --timeout=180 -ra framed/tests || FRAMED_RC=$?

          echo "=== framed/cognition/tests (diagnostic split) ==="
          timeout --kill-after=30 900 pytest -q --timeout=180 -ra framed/cognition/tests || COGNITION_RC=$?

          echo "=== tests (diagnostic split) ==="
          timeout --kill-after=30 900 pytest -q --timeout=180 -ra tests || TOP_RC=$?

          echo ""
          echo "Evidence matrix:"
          echo "  whole suite bounded run: $(label_rc "$WHOLE_RC")"
          echo "  framed/tests:            $(label_rc "$FRAMED_RC")"
          echo "  cognition/tests:       $(label_rc "$COGNITION_RC")"
          echo "  tests:                   $(label_rc "$TOP_RC")"

          exit "$WHOLE_RC"
      - name: Verify fresh PostgreSQL bootstrap and runtime probes
        env:
          DATABASE_URL: postgresql://framed:framed-ci-password@127.0.0.1:5432/framed_public
          SECRET_KEY: framed-ci-secret-key-at-least-32-characters
          FRAMED_ENV: production
          FRAMED_PUBLIC_BETA_ONLY: "true"
          FRAMED_COGNITION_V1: "false"
          FRAMED_VERSION: ci
          FRAMED_BUILD_SHA: ${{ github.sha }}
        run: |
          python -m framed.public_migrations
          python - <<'PY'
          from framed import create_app

          app = create_app()
          client = app.test_client()
          assert client.get("/health").status_code == 200
          assert client.get("/ready").status_code == 200
          version = client.get("/version")
          assert version.status_code == 200
          assert version.get_json()["api_contract"] == "v1"
          PY
      - name: Build production container
        run: docker build --build-arg FRAMED_VERSION=ci --build-arg FRAMED_BUILD_SHA=${{ github.sha }} -t framed-public-beta:${{ github.sha }} .
